# `profilegen extract` is optional: it rebuilds this file from
# page/reydavid_experience.md and overwrites any hand edits.

profile:
  name: Rey David Domínguez Soto
  role_line: |-
    Senior Go Engineer  •  Distributed Systems • Backend, Infrastructure & Developer Tooling
  hero_bio_html: >-
    13+ years delivering production systems — 8+ of them in <strong>Go</strong>.
    I build <strong>high-throughput distributed systems</strong> (gRPC, GraphQL),
    <strong>developer tooling</strong> people actually enjoy using, and
    <strong>security platform integrations</strong> — with a record of
    <strong>10–40x performance gains</strong> rebuilding systems from first
    principles. I ship open source under the <strong>Tecnologer</strong> name.
  bio_html: Senior Go Engineer with 8+ years in Go and 13+ years delivering production systems — building high-throughput
    distributed systems (gRPC, Protobuf, GraphQL), backend infrastructure, developer tooling (CLI/TUI), and MCP/agentic systems.
    I own architecture end-to-end, from the database layer through API and network design to CI/CD, and have delivered 10x–40x
    performance improvements by rebuilding systems from first principles. Comfortable close to the machine (concurrency, memory
    management, OS-level I/O, raw protocol handling) and equally at home operating my own bare-metal and self-hosted infrastructure.
    Daily Linux user (hand-configured distro, custom boot chain) and open source contributor to widely-used Go projects. I've
    led people directly (up to 8 reports), mentored engineers into new roles, and spoken publicly on topics from introductory
    engineering to advanced multithreaded performance. Proven record architecting microservices at scale, integrating 15+
    third-party platforms, keeping migrations safe with parallel-run and fallback strategies, and leading fully remote delivery
    across distributed teams.
